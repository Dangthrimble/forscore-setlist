name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package-version:
        description: Optional version stamp (default ci-<sha>)
        required: false
        type: string
  workflow_call:
    inputs:
      package-version:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  PACKAGE_VERSION: ${{ inputs.package-version || format('ci-{0}', github.sha) }}
  PRODUCT: forscore-setlist
  MODULE: github.com/Dangthrimble/forscore-setlist
  BINARIES: 4ss2open4ss txt2open4ss

jobs:
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-intel
            runner: macos-15-intel
          - platform: macos-apple-silicon
            runner: macos-15
          - platform: windows-x64
            runner: windows-2025
          - platform: windows-arm64
            runner: windows-11-arm
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go mod download
      - run: go mod verify

      - name: Run tests
        if: matrix.platform == 'windows-arm64'
        run: go test -count=1 ./...

      - name: Run tests with race detector
        if: matrix.platform != 'windows-arm64'
        run: go test -race -count=1 ./...

      - run: go vet ./...

      - name: Build release executables
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/bin
          ext=""
          if [ "$(go env GOOS)" = "windows" ]; then ext=".exe"; fi
          for name in $BINARIES; do
            go build -trimpath -ldflags "-X ${MODULE}/internal/version.Version=${PACKAGE_VERSION}" -o "dist/bin/${name}${ext}" "./cmd/${name}"
          done

      - name: Package
        run: |
          ext=""
          if [ "$(go env GOOS)" = "windows" ]; then ext=".exe"; fi
          args=()
          for name in $BINARIES; do
            args+=("-binary" "dist/bin/${name}${ext}")
          done
          go run ./cmd/buildpackage "${args[@]}" -version "${PACKAGE_VERSION}" -out dist/packages

      - name: Upload package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-package-${{ matrix.platform }}
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go mod download
      - run: go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - name: Run staticcheck
        run: |
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0

      - name: Run govulncheck
        env:
          GODEBUG: netdns=cgo
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

  gate:
    name: CI gate
    if: always()
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          for result in "${{ needs.test.result }}" "${{ needs.lint.result }}"; do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed: $result"
              exit 1
            fi
          done

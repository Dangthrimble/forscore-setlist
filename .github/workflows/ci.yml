name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o 4ss2open4ss ./cmd/4ss2open4ss
      - run: go build -o txt2open4ss ./cmd/txt2open4ss
